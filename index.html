<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starlace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="prompt">
      <button id="hear" type="button" aria-label="Turn voice off" aria-pressed="false">
        <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
          <path fill="#3b2258" d="M10 24h10l14-12v40L20 40H10z" />
          <path fill="none" stroke="#3b2258" stroke-width="5" stroke-linecap="round" d="M42 22c6 5 6 15 0 20M48 16c10 8 10 24 0 32" />
        </svg>
      </button>
      <p id="caption"></p>
    </div>
    <div id="progress"></div>
    <button id="boot" type="button" aria-label="Starlace. Tap to play.">
      <div class="boot-fade">
        <div class="boot-logo">
          <svg class="boot-star" viewBox="0 0 64 64" width="58" height="58" aria-hidden="true">
            <path fill="#e7b34a" stroke="#fff6e4" stroke-width="4" stroke-linejoin="round" d="M32 4l6.6 16.4L56 22.2 41.2 33.4 46.2 52 32 42.2 17.8 52l5-18.6L8 22.2l17.4-1.8z" />
          </svg>
          <p class="boot-name">Starlace</p>
          <svg class="boot-lace" viewBox="0 0 360 22" width="300" height="18" aria-hidden="true">
            <path fill="none" stroke="#e7b34a" stroke-width="3.5" stroke-linecap="round" d="M6 6c14 14 22 14 36 0s22-14 36 0 22 14 36 0 22-14 36 0 22 14 36 0 22-14 36 0 22 14 36 0 22-14 36 0 22 14 36 0" />
          </svg>
        </div>
        <span class="boot-title">Tap to play</span>
      </div>
    </button>
    <div id="veil"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
