<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starlace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="prompt">
      <button id="hear" type="button" aria-label="Hear it again">
        <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
          <path fill="#3b2258" d="M10 24h10l14-12v40L20 40H10z" />
          <path fill="none" stroke="#3b2258" stroke-width="5" stroke-linecap="round" d="M42 22c6 5 6 15 0 20M48 16c10 8 10 24 0 32" />
        </svg>
      </button>
      <p id="caption"></p>
    </div>
    <div id="progress"></div>
    <button id="boot" type="button">
      <span class="boot-title">Tap to play</span>
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
